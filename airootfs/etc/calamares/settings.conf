# SPDX-License-Identifier: CC0-1.0
#
# Calamares — Arvora OS (unpackfs clone + Plasma on target)
---
modules-search:
  - local

instances:
  - id: welcome
    module: welcome
    config: welcome.conf

  - id: locale
    module: locale
    config: locale.conf

  - id: keyboard
    module: keyboard
    config: keyboard.conf

  - id: partition
    module: partition
    config: partition.conf

  - id: users
    module: users
    config: users.conf

  - id: summary
    module: summary
    config: summary.conf

  - id: mount
    module: mount
    config: mount.conf

  - id: unpackfs
    module: unpackfs
    config: unpackfs.conf

  - id: machineid
    module: machineid
    config: machineid.conf

  - id: fstab
    module: fstab
    config: fstab.conf

  - id: localecfg
    module: localecfg
    config: localecfg.conf

  - id: initcpiocfg
    module: initcpiocfg
    config: initcpiocfg.conf

  - id: initcpio
    module: initcpio
    config: initcpio.conf

  - id: displaymanager
    module: displaymanager
    config: displaymanager.conf

  - id: bootloader
    module: bootloader
    config: bootloader.conf

  - id: networkcfg
    module: networkcfg
    config: networkcfg.conf

  - id: hwclock
    module: hwclock
    config: hwclock.conf

  - id: services-systemd
    module: services-systemd
    config: services-systemd.conf

  - id: umount
    module: umount
    config: umount.conf

  - id: finished
    module: finished
    config: finished.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: arvora

oem-setup: false
dont-chroot: false
prompt-install: false
disable-cancel-during-exec: true
disable-cancel: false
quit-at-end: false
