# Arvora OS Calamares Settings
# This file contains the general settings for Calamares

# General settings
---
# Module search paths
modulesSearch: [ "src/modules" ]

# Instances section
# This is the top-level key in the config file, and contains
# a list of instances to run, in order.
instances:
- id:       "welcome"
  module:   "welcome"
  config:   "welcome.conf"

- id:       "locale"
  module:   "locale"
  config:   "locale.conf"

- id:       "keyboard"
  module:   "keyboard"
  config:   "keyboard.conf"

- id:       "partition"
  module:   "partition"
  config:   "partition.conf"

- id:       "users"
  module:   "users"
  config:   "users.conf"

- id:       "summary"
  module:   "summary"
  config:   "summary.conf"

- id:       "packages"
  module:   "packages"
  config:   "packages.conf"

- id:       "unpackfs"
  module:   "unpackfs"
  config:   "unpackfs.conf"

- id:       "machineid"
  module:   "machineid"
  config:   "machineid.conf"

- id:       "fstab"
  module:   "fstab"
  config:   "fstab.conf"

- id:       "localecfg"
  module:   "localecfg"
  config:   "localecfg.conf"

- id:       "luksbootkeyfile"
  module:   "luksbootkeyfile"
  config:   "luksbootkeyfile.conf"

- id:       "initcpiocfg"
  module:   "initcpiocfg"
  config:   "initcpiocfg.conf"

- id:       "initcpio"
  module:   "initcpio"
  config:   "initcpio.conf"

- id:       "bootloader"
  module:   "bootloader"
  config:   "bootloader.conf"

- id:       "networkcfg"
  module:   "networkcfg"
  config:   "networkcfg.conf"

- id:       "hwclock"
  module:   "hwclock"
  config:   "hwclock.conf"

- id:       "services-systemd"
  module:   "services-systemd"
  config:   "services-systemd.conf"

- id:       "umount"
  module:   "umount"
  config:   "umount.conf"

# Sequence section
# This defines the sequence of modules that will be started.
# sequence:
#     - show:
#         - welcome
#         - locale
#         - keyboard
#     - exec:
#         - partition
#         - mount
#     - show:
#         - users
#         - summary
#     - exec:
#         - unpackfs
#         - machineid
#         - fstab
#         - locale
#         - luksbootkeyfile
#         - initcpiocfg
#         - initcpio
#         - bootloader
#         - networkcfg
#         - hwclock
#         - services-systemd
#         - umount
#     - show:
#         - finished

# Branding section
# This defines the branding used by Calamares.
branding: arvora

# Prompts section
# This defines the prompts shown to the user during the installation.
prompts:
  - type: "text"
    message: "Welcome to Arvora OS"
    description: "This will install Arvora OS on your computer."
    details: "Arvora OS is a personal Linux distribution based on Arch Linux."

# Pre and post install scripts
# These scripts are run before and after the installation.
# pre-install:
#   - script: "pre-install.sh"
# post-install:
#   - script: "post-install.sh" 