---
# Arvora OS Packages Module Configuration
# This file configures package installation during setup

# Package manager backend
backend: pacman

# Package sources
sources:
  - name: "core"
    url: "https://mirrors.archlinux.org/core/os/x86_64"
  - name: "extra"
    url: "https://mirrors.archlinux.org/extra/os/x86_64"
  - name: "community"
    url: "https://mirrors.archlinux.org/community/os/x86_64"

# Paru configuration
paru:
  num_retries: 3
  disable_download_timeout: false
  needed_only: true

# Package groups to install
packages:
  - "base"
  - "base-devel"
  - "linux"
  - "linux-firmware"
  - "networkmanager"
  - "systemd"
  - "grub"
  - "efibootmgr"
  - "dosfstools"
  - "mtools"
  - "os-prober"
  - "sudo"
  - "vim"
  - "nano"
  - "wget"
  - "curl"
  - "git"
  - "reflector"
  - "archiso"
  - "squashfs-tools"
  - "dosfstools"
  - "libisoburn"
  - "mtools"
  - "cdrkit"
  - "syslinux"

# AUR packages (via paru)
aur_packages:
  - "paru"
  - "yay"
  - "pamac-aur" 