---
# Arvora OS Welcome Module Configuration
# This file configures the welcome page of Calamares

# General settings
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

# URLs
supportUrl:             "https://github.com/Dawdaborje/arvora-os/issues"
knownIssuesUrl:         "https://github.com/Dawdaborje/arvora-os/issues"
releaseNotesUrl:        "https://github.com/Dawdaborje/arvora-os/releases"

# Requirements
requirements:
  # Amount of available disk space (in GiB)
  requiredStorage:      10.0
  
  # Amount of available RAM (in GiB)
  requiredRam:          2.0
  
  # Internet connection requirement
  internetCheckUrl:     "https://archlinux.org"
  
  # Check for root user
  checkRoot:            false
  
  # Check for UEFI
  checkUEFI:            false
  
  # Check for secure boot
  checkSecureBoot:      false

# Welcome page content
welcome:
  title:                "Welcome to Arvora OS"
  subtitle:             "A personal Linux distribution based on Arch Linux"
  message:              "This will install Arvora OS on your computer. Arvora OS is designed for learning and exploration of Linux system components."
  
  # Logo and branding
  logo:                 "arvora-logo"
  
  # Links
  links:
    - name:             "Website"
      url:              "https://github.com/Dawdaborje/arvora-os"
    - name:             "Documentation"
      url:              "https://github.com/Dawdaborje/arvora-os/blob/main/README.md"
    - name:             "Issues"
      url:              "https://github.com/Dawdaborje/arvora-os/issues"
