---
# Arvora OS UnpackFS Module Configuration
# This file configures the extraction of the root filesystem

# Source and destination mappings
unpack:
  # Root filesystem
  - source: "/run/archiso/bootmnt/arvora/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: "/"
    
  # Additional filesystems (if any)
  # - source: "/run/archiso/bootmnt/arvora/x86_64/airootfs.sfs"
  #   sourcefs: "squashfs"
  #   destination: "/usr/local" 