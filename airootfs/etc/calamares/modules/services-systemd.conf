---
# Arvora OS Services Module Configuration
# This file configures systemd services

# Services to enable
services:
  - "NetworkManager"
  - "systemd-resolved"
  - "systemd-timesyncd"
  - "bluetooth"
  - "cups"
  - "avahi-daemon"
  - "sshd"
  - "fstrim.timer"
  - "pkgfile-update.timer"
  - "reflector.timer"

# Services to disable
disable:
  - "systemd-networkd"
  - "systemd-networkd-wait-online"
