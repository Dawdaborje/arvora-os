---
# Arvora OS Bootloader Module Configuration
# This file configures the bootloader installation

# Bootloader type
bootloader: grub

# Installation method
installMode: efi

# Bootloader installation location
efiBootloaderId: "Arvora OS"

# Kernel parameters
kernelParams:
  - "quiet"
  - "splash"
  - "rw"
  - "root=UUID=auto"

# GRUB configuration
grub:
  # Install to EFI partition
  install: true
  
  # Install to MBR
  installToMbr: false
  
  # Install to partition
  installToPartition: false
  
  # Install to disk
  installToDisk: true
  
  # Bootloader ID
  bootloaderId: "Arvora OS"
  
  # Timeout
  timeout: 5
  
  # Default entry
  defaultEntry: "Arvora OS"
  
  # Kernel parameters
  kernelParams:
    - "quiet"
    - "splash"
    - "rw"
    - "root=UUID=auto"
  
  # Theme
  theme: "arvora"
  
  # Background image
  background: "arvora-background.png"
  
  # Icon
  icon: "arvora-icon.png" 